services:
  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 350m
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Shared with celery-worker below. Without this, the S3-unavailable local-disk
      # fallback (services/fluency/store.py, services/storage_service.py) writes into
      # THIS container's own filesystem — a file the api container falls back to
      # storing locally is invisible to celery-worker, which runs analysis in a
      # SEPARATE container. Confirmed in production: an assignment submission fell
      # back to local disk (S3 PutObject denied — IAM only allows the resumes/*
      # prefix, not assignments/*) and the worker then reported the file "unreadable"
      # because it was looking at its own empty /app/uploads. Fixing the underlying
      # IAM policy (add assignments/* PutObject/GetObject) is the real fix and makes
      # this fallback path a non-issue either way — this volume just makes the
      # fallback actually correct in the meantime, and for any future local-disk use.
      - uploads-data:/app/uploads

  celery-worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 250m
    # concurrency=1 for the initial USE_CELERY=true rollout (was 2) — a past
    # incident on this 1GB box coincided with concurrency=2, though the actual
    # root cause was the since-removed local BGE reranker (torch ~1.5-2GB), not
    # the worker's own process count. Keeping this conservative until a few
    # real rank runs have been monitored (docker stats / free -h) with the
    # lighter Cohere-based worker; raise back to 2 only after that.
    command: celery -A celery_app worker --loglevel=info --concurrency=1
    env_file:
      - ./backend/.env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - api

  # Ships all container logs to Grafana Cloud Loki. Browse them at grafana.com.
  # DISABLED: alloy/config.alloy is not present in the repo, so the bind mount
  # fails ("mount a directory onto a file"). Re-enable once a real config.alloy
  # exists at ./alloy/config.alloy and its Loki endpoint/creds are in backend/.env.
  # alloy:
  #   image: grafana/alloy:latest
  #   restart: unless-stopped
  #   command:
  #     - run
  #     - --server.http.listen-addr=0.0.0.0:12345
  #     - --storage.path=/var/lib/alloy/data
  #     - /etc/alloy/config.alloy
  #   env_file:
  #     - ./backend/.env
  #   volumes:
  #     - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - alloy-data:/var/lib/alloy/data

volumes:
  uploads-data:
# alloy-data: (re-enable alongside the alloy service above once config.alloy exists)
