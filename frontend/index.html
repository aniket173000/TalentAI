<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#4CB2FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO ===== -->
    <title>Nideknil — Hire Smarter | AI Candidate Screening &amp; Assessments</title>
    <meta
      name="description"
      content="Nideknil turns a job description into a ranked, explained shortlist — not a pile of résumés. AI-powered candidate screening, skills assessments and AI-fluency scoring for faster, fairer hiring."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.nideknil.in/" />

    <!-- ===== Open Graph (LinkedIn / Slack / WhatsApp / Facebook) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nideknil" />
    <meta property="og:title" content="Nideknil — Hire Smarter" />
    <meta
      property="og:description"
      content="From JD paste to ranked shortlist. AI-powered candidate screening, skills assessments and AI-fluency scoring."
    />
    <meta property="og:url" content="https://www.nideknil.in/" />
    <meta property="og:image" content="https://www.nideknil.in/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nideknil — Hire Smarter. AI candidate screening that turns a JD into a ranked, explained shortlist." />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter / X ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nideknil — Hire Smarter" />
    <meta
      name="twitter:description"
      content="From JD paste to ranked shortlist. AI-powered candidate screening, skills assessments and AI-fluency scoring."
    />
    <meta name="twitter:image" content="https://www.nideknil.in/og-cover.png" />

    <!-- ===== GEO: structured data so answer engines (ChatGPT, Perplexity, Google AI) form a clean entity ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nideknil",
        "url": "https://www.nideknil.in/",
        "logo": "https://www.nideknil.in/icon.svg",
        "slogan": "Hire Smarter",
        "description": "Nideknil is an AI-powered recruitment platform that screens candidates against a job description, runs skills and AI-fluency assessments, and returns a ranked, explained shortlist."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nideknil",
        "url": "https://www.nideknil.in/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nideknil",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.nideknil.in/",
        "description": "AI candidate screening and assessment platform that turns a job description into a ranked, explained shortlist.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Primary UI — Inter (body) + Outfit (display/headings) + JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Landing page — Geist + Geist Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- GEO/SEO fallback: real, extractable text for crawlers and answer engines that do not execute JS.
         React replaces #root on hydrate; this <noscript> only shows when JS is off. -->
    <noscript>
      <main>
        <h1>Nideknil — Hire Smarter</h1>
        <p>
          Nideknil is an AI-powered recruitment platform. Paste a job description and Nideknil screens
          candidates, runs skills and AI-fluency assessments, and returns a ranked, explained shortlist —
          not a pile of résumés.
        </p>
        <h2>What Nideknil does</h2>
        <ul>
          <li>Turns a JD into a ranked, explained candidate shortlist.</li>
          <li>Runs AI-fluency and skills assessments for every applicant.</li>
          <li>Gives candidates instant, actionable feedback.</li>
          <li>Builds a larger, searchable talent and referral pool for recruiters.</li>
        </ul>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
